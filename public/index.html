<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GunStamps</title>
  <meta name="description" content="Parental guidance stamps for kids’ movies — guns, explosions, scary scenes, and more." />
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <header class="hero">
    <p class="brand">GunStamps</p>
    <p class="tagline">Know what’s in the cartoon before you press play.</p>
    <div class="search-wrap">
      <input id="q" type="search" placeholder="Search movies…" autocomplete="off" autofocus />
    </div>
  </header>

  <main>
    <p id="status" class="muted">Loading…</p>
    <table class="results" id="table" hidden>
      <thead>
        <tr>
          <th>Title</th>
          <th>Poster</th>
          <th>Result</th>
          <th>Segments</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" class="empty" hidden>No movies match that search.</p>
  </main>

  <footer class="muted">
    <p>Public catalog is a staged snapshot. Canonical stamps live behind the API contract — not a scrapable dump of the full library.</p>
  </footer>

  <script src="/js/app.js"></script>
</body>
</html>
