<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Movie — GunStamps</title>
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <header class="detail-header">
    <p class="muted crumb"><a href="/">← All movies</a></p>
    <div class="detail-hero">
      <img id="poster" class="poster-lg" alt="" hidden />
      <div class="detail-hero-text">
        <h1 id="title">…</h1>
        <p id="blurb" class="muted"></p>
        <div id="safety" class="safety-panel" hidden></div>
      </div>
    </div>
  </header>

  <main>
    <section class="timeline-wrap">
      <h2>Timeline</h2>
      <p class="muted section-help">Hover a scene bar to preview.</p>
      <div class="timeline" id="timeline" hidden>
        <div class="track"></div>
      </div>
      <div id="seg-tooltip" class="seg-tooltip" hidden>
        <img id="seg-tooltip-img" alt="" width="300" height="300" />
        <div class="seg-tooltip-meta">
          <span id="seg-tooltip-cat" class="pill"></span>
          <span id="seg-tooltip-time" class="mono"></span>
          <p id="seg-tooltip-text"></p>
        </div>
      </div>
      <div class="legend" id="legend"></div>
    </section>

    <section>
      <h2>Flagged scenes</h2>
      <p class="muted section-help">Merged spans with a short description.</p>
      <div id="scenes"></div>
    </section>
  </main>

  <script src="/js/movie.js"></script>
</body>
</html>
