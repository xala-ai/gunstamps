<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Movie — GunStamps</title>
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <header class="hero" style="text-align:left;padding-top:1.25rem">
    <p class="muted"><a href="/">← All movies</a></p>
    <p class="brand" id="title">…</p>
    <p class="tagline" id="summary"></p>
  </header>
  <main>
    <div id="panel"></div>
    <h2 style="font-size:1.1rem;margin-top:2rem">Segments</h2>
    <div id="segs" class="muted">Loading…</div>
  </main>
  <script>
    (function () {
      const id = new URLSearchParams(location.search).get("id");
      const title = document.getElementById("title");
      const summary = document.getElementById("summary");
      const panel = document.getElementById("panel");
      const segs = document.getElementById("segs");
      if (!id) {
        title.textContent = "Missing movie id";
        return;
      }
      fetch("/api/v1/movies/" + encodeURIComponent(id) + ".json")
        .then((r) => {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        })
        .then((m) => {
          document.title = m.title + " — GunStamps";
          title.textContent = m.title + (m.year ? " (" + m.year + ")" : "");
          summary.textContent = m.summary || "";
          const s = m.safety || {};
          const bar = (s.bar || [])
            .map(
              (p) =>
                '<span class="safety-seg ' +
                p.id +
                '" style="width:' +
                Number(p.share_pct || 0).toFixed(2) +
                '%" title="' +
                (p.tooltip || p.label || "").replace(/"/g, "&quot;") +
                '"></span>'
            )
            .join("");
          panel.innerHTML =
            '<div style="display:flex;gap:1.25rem;align-items:flex-start;flex-wrap:wrap">' +
            (m.poster
              ? '<img class="poster-thumb" style="width:8rem;height:12rem" src="' +
                m.poster +
                '" alt="" />'
              : "") +
            '<div style="flex:1;min-width:16rem">' +
            '<div class="safety-bar" style="height:16px">' +
            bar +
            "</div>" +
            '<div class="meta" style="margin-top:0.6rem"><span class="rag ' +
            (s.rag || "") +
            '">' +
            (s.rag_label || "") +
            "</span><span>" +
            (s.headline || "") +
            "</span></div>" +
            '<p class="muted">' +
            (m.segment_count || 0) +
            " segments</p></div></div>";
          const list = m.segments || [];
          if (!list.length) {
            segs.textContent = "No segments.";
            return;
          }
          segs.innerHTML =
            '<table class="results"><thead><tr><th>Time</th><th>Category</th><th>Notes</th></tr></thead><tbody>' +
            list
              .map((seg) => {
                const t0 = Math.floor(seg.t_start || 0);
                const t1 = Math.floor(seg.t_end || 0);
                const fmt = (t) =>
                  String(Math.floor(t / 60)).padStart(2, "0") +
                  ":" +
                  String(t % 60).padStart(2, "0");
                return (
                  "<tr><td class=\"mono\">" +
                  fmt(t0) +
                  "–" +
                  fmt(t1) +
                  "</td><td>" +
                  (seg.category || "") +
                  "</td><td class=\"muted\">" +
                  (seg.summary || "") +
                  "</td></tr>"
                );
              })
              .join("") +
            "</tbody></table>";
        })
        .catch(() => {
          title.textContent = "Not found";
          segs.textContent = "";
        });
    })();
  </script>
</body>
</html>
